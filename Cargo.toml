[package]
name = "pacord"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
toml = "0.8"
evdev = "0.12"
input-linux = "0.7"
gilrs = "0.10"
eframe = "0.28"
egui = "0.28"
log = "0.4"
env_logger = "0.11"
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screencast", "pipewire"] }
pipewire = "0.9.2"
x11-dl = "2.21.0"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
hmac = "0.12"
sha2 = "0.10"
uuid = { version = "1.10", features = ["v4"] }
getrandom = "0.4"
